<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuriQuest - Explorar</title>
    <link rel="icon" type="image/png" href="Logo3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-200 md:p-4 h-screen flex items-center justify-center">

    <!-- Container Principal (Tela cheia no mobile, centralizado no PC) -->
    <div class="w-full h-screen md:max-w-7xl md:h-[95vh] bg-white md:rounded-3xl shadow-2xl flex flex-col md:flex-row overflow-hidden border-none md:border border-gray-100 relative">
        
        <!-- ========================================== -->
        <!-- SIDEBAR - MENU LATERAL (APARECE SÓ NO PC)  -->
        <!-- ========================================== -->
        <aside class="hidden md:flex w-64 border-r border-gray-100 flex-col items-center py-8">
            <div class="flex items-center justify-center mb-6 mt-4 px-4 w-full h-29">
                <img src="Logo3.png" alt="Logo TuriQuest" class="h-full w-auto object-contain mix-blend-multiply">
            </div>

            <nav class="flex flex-col gap-4 w-full px-4">
                <a href="index.html" class="flex items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#304738] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-house text-xl"></i>
                    <span class="text-base">Início</span>
                </a>
                <!-- Item Ativo: Explorar -->
                <a href="explorar.html" class="flex items-center gap-3 bg-[#E8ECE9] text-[#304738] py-3 px-4 rounded-xl font-bold transition-colors shadow-sm">
                    <i class="fa-solid fa-magnifying-glass text-xl text-[#304738]"></i>
                    <span class="text-base">Explorar</span>
                </a>
                <a href="viagem.html" class="flex items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#304738] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-suitcase-rolling text-xl"></i>
                    <span class="text-base">Viagem</span>
                </a>
                <a href="desafios.html" class="flex items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#304738] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-trophy text-xl"></i>
                    <span class="text-base">Desafios</span>
                </a>
                <a href="perfil.html" class="flex items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#304738] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-regular fa-user text-xl"></i>
                    <span class="text-base">Perfil</span>
                </a>
                <a href="guia.html" class="flex items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#304738] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-leaf text-xl"></i>
                    <span class="text-base">Guia Local</span>
                </a>
            </nav>
        </aside>

        <!-- ========================================== -->
        <!-- CONTEÚDO PRINCIPAL                         -->
        <!-- ========================================== -->
        <main class="flex-1 flex flex-col bg-gray-50/50 relative overflow-y-auto pb-24 md:pb-0">
            <!-- Header (Topo) -->
            <header class="flex justify-between items-center p-6 md:p-8 pb-4">
                <!-- Logo no Mobile (Some no PC) -->
                <img src="Logo3.png" alt="Logo TQ" class="h-8 w-auto object-contain mix-blend-multiply md:hidden">
                
                <p class="hidden md:block text-gray-500 text-lg">Explore mais. <span class="font-bold text-[#304738]">Viva melhor.</span></p>
                
                <div class="flex items-center gap-4">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-[#304738]">Olá, Isabella!</p>
                        <p class="text-xs text-gray-500">Pronta para sua próxima aventura?</p>
                    </div>
                    <img src="https://picsum.photos/id/64/150/150" alt="Perfil" class="w-10 h-10 md:w-12 md:h-12 rounded-full border-2 border-[#304738]">
                </div>
            </header>

            <div class="px-6 md:px-8 pb-6 md:pb-8 flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-4 md:mb-6">
                    <h2 class="text-xl md:text-2xl font-bold text-[#304738]">Explorar Tendências</h2>
                </div>

                <!-- Container do Mapa -->
                <div class="flex-1 rounded-2xl md:rounded-3xl relative overflow-hidden shadow-md border border-gray-200 bg-[#e5e7eb] min-h-[400px] md:min-h-0">
                    <!-- Imagem de fundo simulando o mapa -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-80 mix-blend-multiply" style="background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2000&auto=format&fit=crop');"></div>
                    
                    <!-- Sobreposição de cor -->
                    <div class="absolute inset-0 bg-blue-50/70"></div>

                    <!-- Pinos de Localização (Exemplos espalhados) -->
                    <div class="absolute top-1/4 left-[40%] flex flex-col items-center">
                        <div class="w-6 h-6 md:w-8 md:h-8 bg-orange-400 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-[10px] md:text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[35%] left-[60%] flex flex-col items-center">
                        <div class="w-6 h-6 md:w-8 md:h-8 bg-purple-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-[10px] md:text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[55%] left-[50%] flex flex-col items-center">
                        <div class="w-6 h-6 md:w-8 md:h-8 bg-teal-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-[10px] md:text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[65%] left-[70%] flex flex-col items-center">
                        <div class="w-6 h-6 md:w-8 md:h-8 bg-indigo-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-[10px] md:text-xs"></i>
                        </div>
                        <span class="mt-1 text-[10px] md:text-xs font-bold text-gray-800 bg-white/80 px-2 py-0.5 rounded shadow-sm backdrop-blur-sm whitespace-nowrap">Chapada Diamantina</span>
                    </div>

                    <!-- Controles de Zoom -->
                    <div class="absolute bottom-4 right-4 md:bottom-6 md:right-6 flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
                        <button class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center hover:bg-gray-100 border-b border-gray-100 transition-colors">
                            <i class="fa-solid fa-plus text-xs md:text-sm text-gray-600"></i>
                        </button>
                        <button class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center hover:bg-gray-100 transition-colors">
                            <i class="fa-solid fa-minus text-xs md:text-sm text-gray-600"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- ========================================== -->
        <!-- MENU INFERIOR MOBILE (SÓ APARECE NO CELULAR)-->
        <!-- ========================================== -->
        <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white flex justify-around items-center pt-3 pb-6 px-2 border-t border-gray-100 rounded-t-2xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50">
            <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#304738]">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-[10px] font-medium">Início</span>
            </a>
            <!-- Item Ativo no Mobile: Explorar -->
            <a href="explorar.html" class="flex flex-col items-center gap-1 text-[#304738]">
                <i class="fa-solid fa-magnifying-glass text-xl"></i>
                <span class="text-[10px] font-medium">Explorar</span>
            </a>
            
            <!-- Botão Central (Bússola) com estilo Flutuante -->
            <a href="#" class="w-12 h-12 bg-[#304738] rounded-full flex items-center justify-center text-white text-2xl -mt-8 shadow-[0_5px_15px_rgba(106,72,215,0.4)]">
                <i class="fa-regular fa-compass"></i>
            </a>

            <a href="viagem.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#304738]">
                <i class="fa-solid fa-suitcase-rolling text-xl"></i>
                <span class="text-[10px] font-medium">Viagem</span>
            </a>
            <a href="perfil.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#304738]">
                <i class="fa-regular fa-user text-xl"></i>
                <span class="text-[10px] font-medium">Perfil</span>
            </a>
        </nav>

    </div>
</body>
</html>
