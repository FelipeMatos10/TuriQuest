<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuriQuest - Explorar</title>
    <link rel="icon" type="image/png" href="LogoTuriQuest.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-200 p-4 h-screen flex items-center justify-center">

    <div class="w-full max-w-7xl h-[95vh] bg-white rounded-3xl shadow-2xl flex overflow-hidden border border-gray-100">
        
        <!-- Sidebar -->
        <aside class="w-24 md:w-64 border-r border-gray-100 flex flex-col items-center py-8">
            <div class="flex items-center justify-center mb-6 mt-4 px-4 w-full h-29">
                <img src="LogoTuriQuest.png" alt="Logo TuriQuest" class="h-full w-auto object-contain mix-blend-multiply hidden md:block">
                <img src="LogoTuriQuest.png" alt="Logo TQ" class="h-10 w-auto object-contain mix-blend-multiply md:hidden">
            </div>

            <nav class="flex flex-col gap-4 w-full px-4">
                <a href="index.html" class="flex flex-col md:flex-row items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#9575CD] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-house text-xl"></i>
                    <span class="text-sm md:text-base hidden md:block">Início</span>
                </a>
                <a href="explorar.html" class="flex flex-col md:flex-row items-center gap-3 bg-[#F3E5F5] text-[#2A1A4A] py-3 px-4 rounded-xl font-bold transition-colors shadow-sm">
                    <i class="fa-solid fa-magnifying-glass text-xl text-[#9575CD]"></i>
                    <span class="text-sm md:text-base hidden md:block">Explorar</span>
                </a>
                <a href="viagem.html" class="flex flex-col md:flex-row items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#9575CD] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-suitcase-rolling text-xl"></i>
                    <span class="text-sm md:text-base hidden md:block">Viagem</span>
                </a>
                <a href="desafios.html" class="flex flex-col md:flex-row items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#9575CD] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-trophy text-xl"></i>
                    <span class="text-sm md:text-base hidden md:block">Desafios</span>
                </a>
                <a href="perfil.html" class="flex flex-col md:flex-row items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#9575CD] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-regular fa-user text-xl"></i>
                    <span class="text-sm md:text-base hidden md:block">Perfil</span>
                </a>
                <a href="guia.html" class="flex flex-col md:flex-row items-center gap-3 text-gray-500 hover:bg-gray-50 hover:text-[#9575CD] py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-leaf text-xl"></i>
                    <span class="text-sm md:text-base hidden md:block">Guia Local</span>
                </a>
            </nav>
        </aside>

       <!-- Conteúdo Principal -->
        <main class="flex-1 flex flex-col bg-gray-50/50 relative">
            <header class="flex justify-between items-center p-8 pb-4">
                <p class="text-gray-500 text-lg">Explore mais. <span class="font-bold text-[#2A1A4A]">Viva melhor.</span></p>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-[#2A1A4A]">Olá, Isabella!</p>
                        <p class="text-xs text-gray-500">Pronta para sua próxima aventura?</p>
                    </div>
                    <img src="https://picsum.photos/id/64/150/150" alt="Perfil" class="w-12 h-12 rounded-full border-2 border-[#9575CD]">
                </div>
            </header>

            <div class="px-8 pb-8 flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-[#2A1A4A]">Explorar Tendências</h2>
                </div>

                <!-- Container do Mapa -->
                <div class="flex-1 rounded-3xl relative overflow-hidden shadow-md border border-gray-200 bg-[#e5e7eb]">
                    <!-- Imagem de fundo simulando o mapa (Você pode trocar por um iframe do Google Maps ou outra API depois) -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-80 mix-blend-multiply" style="background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2000&auto=format&fit=crop');"></div>
                    
                    <!-- Sobreposição de cor para ficar com o tom de mapa cartográfico do protótipo -->
                    <div class="absolute inset-0 bg-blue-50/70"></div>

                    <!-- Pinos de Localização (Exemplos espalhados) -->
                    <div class="absolute top-1/4 left-[40%] flex flex-col items-center">
                        <div class="w-8 h-8 bg-orange-400 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[35%] left-[60%] flex flex-col items-center">
                        <div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[55%] left-[50%] flex flex-col items-center">
                        <div class="w-8 h-8 bg-teal-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-xs"></i>
                        </div>
                    </div>

                    <div class="absolute top-[65%] left-[70%] flex flex-col items-center">
                        <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                            <i class="fa-solid fa-star text-xs"></i>
                        </div>
                        <span class="mt-1 text-xs font-bold text-gray-800 bg-white/80 px-2 py-0.5 rounded shadow-sm backdrop-blur-sm">Chapada Diamantina</span>
                    </div>

                    <!-- Controles de Zoom -->
                    <div class="absolute bottom-6 right-6 flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
                        <button class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 border-b border-gray-100 transition-colors">
                            <i class="fa-solid fa-plus text-gray-600"></i>
                        </button>
                        <button class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 transition-colors">
                            <i class="fa-solid fa-minus text-gray-600"></i>
                        </button>
                    </div>

                </div>

                    <!-- Controles de Zoom -->
                    <div class="absolute bottom-6 right-6 flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
                        <button class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 border-b border-gray-100 transition-colors"><i class="fa-solid fa-plus text-gray-600"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 transition-colors"><i class="fa-solid fa-minus text-gray-600"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
